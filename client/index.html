<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackPulse - GitHub Developer Analytics & Comparison</title>
    <meta name="description" content="Search GitHub developers, analyze repository activity, compare developers side-by-side, and pin favorite repositories." />
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Theme Setup: Permanent Dark Mode -->
    <script>
      try {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        localStorage.setItem('stackpulse_theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070A12] dark:text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
