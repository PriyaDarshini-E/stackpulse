<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <!-- Inner Highlight border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Activity / Pulse Heartbeat Waveform -->
  <path d="M6 16h4.5l2.5-6 4 12 3-8 2.5 4H26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Live Status Accent Dot -->
  <circle cx="25" cy="7" r="2.2" fill="#10B981"/>
</svg>
