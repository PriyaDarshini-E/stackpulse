version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stackpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: stackpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stackpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
